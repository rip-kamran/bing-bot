name: Bing Bot

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Restore cookie cache
        uses: actions/cache@v4
        with:
          path: /tmp/ms_cookies.json
          key: ms-cookies-${{ github.run_id }}
          restore-keys: ms-cookies-

      - name: Install deps
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Run bot
        env:
          MS_EMAIL:    ${{ secrets.MS_EMAIL }}
          MS_PASSWORD: ${{ secrets.MS_PASSWORD }}
        run: node bot.js

      - name: Save cookie cache
        if: always()
        uses: actions/cache@v4
        with:
          path: /tmp/ms_cookies.json
          key: ms-cookies-${{ github.run_id }}

      - name: Upload debug screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug
          path: debug.png
          if-no-files-found: ignore
